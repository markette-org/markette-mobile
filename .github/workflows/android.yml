name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: markette-mobile
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/markette-web
          path: markette-web
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); Gradle fetches missing platforms.
      - name: Build web app and sync
        working-directory: markette-mobile
        run: npm ci && npm run sync
      - name: Assemble debug APK
        working-directory: markette-mobile/android
        run: ./gradlew --no-daemon assembleDebug
      - run: mv markette-mobile/android/app/build/outputs/apk/debug/app-debug.apk markette.apk
      - uses: actions/upload-artifact@v4
        with:
          name: markette-apk
          path: markette.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: markette.apk
